    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const entryId = templateData.entry;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        const bytes = new Uint8Array(binaryStr.length);

            'e.preventDefault();' +

              'try { pid = decodeURIComponent(pid); } catch(err) {}' +

      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per

        for (const a of old.attributes) s.setAttribute(a.name, a.value);

            s.textContent = await r.text();

        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.

      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {

      }

    }

    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });

      var gen = ++navGen;
      frame.onload = function() {

        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}

                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);

gleTheme }}\" aria-label=\"Toggle theme\" style=\"width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition:border-color 0.25s, color 0.25s;\" style-hover=\"border-color:var(--accent); color:var(--ink);\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" style=\"display:var(--sun-d);\">\n            <circle cx=\"9\" cy=\"9\" r=\"3.4\"><\u002Fcircle>\n            <path d=\"M9 1.4V2.8 M9 15.2V16.6 M1.4 9H2.8 M15.2 9H16.6 M3.6 3.6L4.6 4.6 M13.4 13.4L14.4 14.4 M14.4 3.6L13.4 4.6 M4.6 13.4L3.6 14.4\"><\u002Fpath>\n          <\u002Fsvg>\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"display:var(--moon-d);\">\n            <path d=\"M15.5 10.6A6.4 6.4 0 1 1 7.4 2.5 5 5 0 0 0 15.5 10.6Z\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- ===== Hero ===== -->\n  <section id=\"hero\" data-screen-label=\"Hero\" style=\"position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:200px 32px 150px; background:radial-gradient(880px 580px at 30% 46%, color-mix(in srgb, var(--bg) 90%, transparent) 0%, color-mix(in srgb, var(--bg) 76%, transparent) 38%, transparent 76%) no-repeat;\">\n    <div style=\"max-width:780px;\">\n      <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:30px;\">\n        <span style=\"width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px 1px var(--accent);\"><\u002Fspan>\n        <span style=\"text-transform:uppercase; letter-spacing:0.2em; font-size:12px; font-weight:600; color:var(--accent);\">Productized automation for small business<\u002Fspan>\n      <\u002Fdiv>\n      <h1 ref=\"{{ headlineRef }}\" style=\"font-size:clamp(46px,6.6vw,82px); line-height:1.04; letter-spacing:-0.03em; font-weight:800; margin:0 0 28px;\">\n        Your business,<br>finally running itself.\n      <\u002Fh1>\n      <p style=\"font-size:clamp(17px,2vw,21px); line-height:1.55; color:var(--ink-soft); max-width:600px; margin:0 0 40px; font-weight:400;\">For small businesses still running on memory, sticky notes, and missed calls. Zephlyn connects your scattered tools and tasks into one flow that runs without you.<\u002Fp>\n      <div style=\"display:flex; align-items:center; gap:20px; flex-wrap:wrap;\">\n        <a data-mail=\"\" style=\"display:inline-flex; align-items:center; gap:9px; font-size:15px; font-weight:600; color:#fff; background:var(--accent); padding:15px 28px; border-radius:999px; text-decoration:none; box-shadow:0 12px 34px -12px var(--accent); transition:transform 0.2s ease, box-shadow 0.2s ease;\" style-hover=\"transform:translateY(-2px); box-shadow:0 18px 40px -12px var(--accent);\">\n          Get in touch\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7.5h8 M7.5 4l3.5 3.5L7.5 11\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"#how\" style=\"display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:600; color:var(--ink-soft); text-decoration:none; transition:color 0.2s ease;\" style-hover=\"color:var(--ink);\">\n          See how it works\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.5 3v8 M4 7.5l3.5 3.5L11 7.5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== The problem ===== -->\n  <section id=\"problem\" data-screen-label=\"The problem\" style=\"position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:120px 32px; background:radial-gradient(700px 340px at 5% 165px, color-mix(in srgb, var(--bg) 90%, transparent) 0%, transparent 70%) no-repeat;\">\n    <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:22px;\">\n      <span style=\"width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px 1px var(--accent);\"><\u002Fspan>\n      <span style=\"text-transform:uppercase; letter-spacing:0.2em; font-size:12px; font-weight:600; color:var(--accent);\">The scatter<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(32px,4.4vw,52px); line-height:1.06; letter-spacing:-0.025em; font-weight:800; margin:0 0 18px; max-width:640px;\">Right now, it all lives in your head.<\u002Fh2>\n    <p style=\"font-size:18px; line-height:1.6; color:var(--ink-soft); max-width:540px; margin:0 0 56px;\">Nothing's connected. Every task is a loose thread you have to hold onto yourself — and the moment you get busy, threads start slipping.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:18px; overflow:hidden;\">\n      <div style=\"background:var(--bg); padding:34px 30px;\">\n        <span style=\"display:block; width:6px; height:6px; border-radius:50%; background:var(--ink-faint); margin-bottom:20px;\"><\u002Fspan>\n        <h3 style=\"font-size:19px; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em;\">Bookings in a notebook<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0;\">Appointments written down, double-booked, or forgotten between the page and the calendar.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--bg); padding:34px 30px;\">\n        <span style=\"display:block; width:6px; height:6px; border-radius:50%; background:var(--ink-faint); margin-bottom:20px;\"><\u002Fspan>\n        <h3 style=\"font-size:19px; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em;\">Calls to voicemail<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0;\">You're on the job, the phone rings, nobody answers — and the lead quietly goes somewhere else.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--bg); padding:34px 30px;\">\n        <span style=\"display:block; width:6px; height:6px; border-radius:50%; background:var(--ink-faint); margin-bottom:20px;\"><\u002Fspan>\n        <h3 style=\"font-size:19px; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em;\">Inventory by hand<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0;\">Counted on a clipboard once in a while, never quite current, always a guess when it matters.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--bg); padding:34px 30px;\">\n        <span style=\"display:block; width:6px; height:6px; border-radius:50%; background:var(--ink-faint); margin-bottom:20px;\"><\u002Fspan>\n        <h3 style=\"font-size:19px; font-weight:700; margin:0 0 8px; letter-spacing:-0.01em;\">The system is you<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0;\">The whole operation runs on what you remember. If you stop, it stops. That doesn't scale.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== Three services ===== -->\n  <section id=\"services\" data-screen-label=\"The three services\" style=\"position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:120px 32px; background:radial-gradient(560px 210px at 50% 168px, color-mix(in srgb, var(--bg) 78%, transparent) 0%, color-mix(in srgb, var(--bg) 62%, transparent) 45%, transparent 80%) no-repeat;\">\n    <div style=\"text-align:center; margin-bottom:18px; display:flex; flex-direction:column; align-items:center; gap:22px;\">\n      <div style=\"display:flex; align-items:center; gap:9px;\">\n        <span style=\"width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px 1px var(--accent);\"><\u002Fspan>\n        <span style=\"text-transform:uppercase; letter-spacing:0.2em; font-size:12px; font-weight:600; color:var(--accent);\">What we build<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <h2 style=\"text-align:center; font-size:clamp(32px,4.4vw,52px); line-height:1.06; letter-spacing:-0.025em; font-weight:800; margin:0 auto 16px; max-width:680px;\">Three systems. One connected flow.<\u002Fh2>\n    <p style=\"text-align:center; font-size:18px; line-height:1.6; color:var(--ink-soft); max-width:560px; margin:0 auto 18px;\">Three equal pillars. On their own, useful. Connected, they become the thing your business never had — a system that runs without you holding it together.<\u002Fp>\n\n    <!-- connector: three stars linking -->\n    <div ref=\"{{ svcRef }}\" style=\"display:flex; justify-content:center; margin:14px auto 46px;\">\n      <svg width=\"220\" height=\"64\" viewBox=\"0 0 220 64\" fill=\"none\" style=\"overflow:visible;\">\n        <line data-svcline=\"\" x1=\"34\" y1=\"46\" x2=\"110\" y2=\"18\" stroke=\"var(--line)\" stroke-width=\"1.4\" pathLength=\"1\" style=\"stroke-dasharray:1; stroke-dashoffset:1;\"><\u002Fline>\n        <line data-svcline=\"\" x1=\"110\" y1=\"18\" x2=\"186\" y2=\"46\" stroke=\"var(--line)\" stroke-width=\"1.4\" pathLength=\"1\" style=\"stroke-dasharray:1; stroke-dashoffset:1;\"><\u002Fline>\n        <line data-svcline=\"\" x1=\"34\" y1=\"46\" x2=\"186\" y2=\"46\" stroke=\"var(--line)\" stroke-width=\"1.4\" pathLength=\"1\" style=\"stroke-dasharray:1; stroke-dashoffset:1;\"><\u002Fline>\n        <circle cx=\"110\" cy=\"18\" r=\"4.5\" fill=\"var(--accent)\"><\u002Fcircle>\n        <circle cx=\"34\" cy=\"46\" r=\"4.5\" fill=\"var(--accent)\"><\u002Fcircle>\n        <circle cx=\"186\" cy=\"46\" r=\"4.5\" fill=\"var(--accent)\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:22px;\">\n      <div style=\"background:var(--card); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--panel-line); border-radius:20px; padding:36px 32px;\">\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:22px;\">\n          <span style=\"width:11px; height:11px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px 1px var(--accent);\"><\u002Fspan>\n          <span style=\"font-size:13px; font-weight:600; color:var(--ink-faint); letter-spacing:0.04em;\">01<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-size:23px; font-weight:700; letter-spacing:-0.02em; margin:0 0 12px;\">Booking &amp; scheduling<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.6; color:var(--ink-soft); margin:0 0 24px;\">Automated booking, confirmations, and reminders. No more back-and-forth, no more no-shows slipping through.<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:11px;\">\n          <div style=\"display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--ink-soft); line-height:1.45;\"><span style=\"color:var(--accent); margin-top:2px;\">✦<\u002Fspan>Online booking that fills your calendar<\u002Fdiv>\n          <div style=\"display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--ink-soft); line-height:1.45;\"><span style=\"color:var(--accent); margin-top:2px;\">✦<\u002Fspan>Automatic confirmations and reminders<\u002Fdiv>\n          <div style=\"display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--ink-soft); line-height:1.45;\"><span style=\"color:var(--accent); margin-top:2px;\">✦<\u002Fspan>Fewer gaps, fewer no-shows<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--card); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--panel-line); border-radius:20px; padding:36px 32px;\">\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:22px;\">\n          <span style=\"width:11px; height:11px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px 1px var(--accent);\"><\u002Fspan>\n          <span style=\"font-size:13px; font-weight:600; color:var(--ink-faint); letter-spacing:0.04em;\">02<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-size:23px; font-weight:700; letter-spacing:-0.02em; margin:0 0 12px;\">Call &amp; email response<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.6; color:var(--ink-soft); margin:0 0 24px;\">Automated responses so nothing goes unanswered when you're busy working. Every lead gets a reply.<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:11px;\">\n          <div style=\"display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--ink-soft); line-height:1.45;\"><span style=\"color:var(--accent); margin-top:2px;\">✦<\u002Fspan>Instant replies while you're on the job<\u002Fdiv>\n          <div style=\"display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--ink-soft); line-height:1.45;\"><span style=\"color:var(--accent); margin-top:2px;\">✦<\u002Fspan>Every lead gets a response<\u002Fdiv>\n          <div style=\"display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--ink-soft); line-height:1.45;\"><span style=\"color:var(--accent); margin-top:2px;\">✦<\u002Fspan>Messages triaged, not missed<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--card); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--panel-line); border-radius:20px; padding:36px 32px;\">\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:22px;\">\n          <span style=\"width:11px; height:11px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px 1px var(--accent);\"><\u002Fspan>\n          <span style=\"font-size:13px; font-weight:600; color:var(--ink-faint); letter-spacing:0.04em;\">03<\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-size:23px; font-weight:700; letter-spacing:-0.02em; margin:0 0 12px;\">Inventory &amp; insights<\u002Fh3>\n        <p style=\"font-size:15px; line-height:1.6; color:var(--ink-soft); margin:0 0 24px;\">Live inventory tracking, workflow automation, dashboards, and metrics. See what's happening and where to optimize.<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:11px;\">\n          <div style=\"display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--ink-soft); line-height:1.45;\"><span style=\"color:var(--accent); margin-top:2px;\">✦<\u002Fspan>Real-time inventory counts<\u002Fdiv>\n          <div style=\"display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--ink-soft); line-height:1.45;\"><span style=\"color:var(--accent); margin-top:2px;\">✦<\u002Fspan>Workflow automation behind the scenes<\u002Fdiv>\n          <div style=\"display:flex; gap:11px; align-items:flex-start; font-size:14px; color:var(--ink-soft); line-height:1.45;\"><span style=\"color:var(--accent); margin-top:2px;\">✦<\u002Fspan>One dashboard for what matters<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== How it works / the connection ===== -->\n  <section id=\"how\" data-screen-label=\"How it works\" style=\"position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:120px 32px; background:radial-gradient(700px 340px at 5% 165px, color-mix(in srgb, var(--bg) 90%, transparent) 0%, transparent 70%) no-repeat;\">\n    <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:22px;\">\n      <span style=\"width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px 1px var(--accent);\"><\u002Fspan>\n      <span style=\"text-transform:uppercase; letter-spacing:0.2em; font-size:12px; font-weight:600; color:var(--accent);\">The connection<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(32px,4.4vw,52px); line-height:1.06; letter-spacing:-0.025em; font-weight:800; margin:0 0 18px; max-width:680px;\">We connect what you already do into one flow.<\u002Fh2>\n    <p style=\"font-size:18px; line-height:1.6; color:var(--ink-soft); max-width:560px; margin:0 0 56px;\">You don't throw anything out. We connect the tools you already use, draw the lines between your scattered tasks, and hand you back a system that runs itself.<\u002Fp>\n\n    <div ref=\"{{ howRef }}\" style=\"background:var(--card); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--panel-line); border-radius:22px; padding:48px clamp(24px,4vw,56px); display:grid; grid-template-columns:1fr; gap:40px; align-items:center;\">\n      <svg viewBox=\"0 0 560 220\" style=\"width:100%; height:auto; max-height:260px;\" fill=\"none\">\n        <text x=\"74\" y=\"20\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-family=\"Plus Jakarta Sans\" font-size=\"13\" font-weight=\"600\" letter-spacing=\"0.04em\">Today — scattered<\u002Ftext>\n        <text x=\"486\" y=\"20\" text-anchor=\"middle\" fill=\"var(--accent)\" font-family=\"Plus Jakarta Sans\" font-size=\"13\" font-weight=\"600\" letter-spacing=\"0.04em\">With Zephlyn — connected<\u002Ftext>\n        <!-- scattered side -->\n        <circle cx=\"30\" cy=\"70\" r=\"3.4\" fill=\"var(--ink-faint)\"><\u002Fcircle>\n        <circle cx=\"120\" cy=\"58\" r=\"2.6\" fill=\"var(--ink-faint)\"><\u002Fcircle>\n        <circle cx=\"64\" cy=\"120\" r=\"3\" fill=\"var(--ink-faint)\"><\u002Fcircle>\n        <circle cx=\"138\" cy=\"138\" r=\"2.4\" fill=\"var(--ink-faint)\"><\u002Fcircle>\n        <circle cx=\"22\" cy=\"168\" r=\"2.8\" fill=\"var(--ink-faint)\"><\u002Fcircle>\n        <circle cx=\"104\" cy=\"178\" r=\"3.2\" fill=\"var(--ink-faint)\"><\u002Fcircle>\n        <!-- flow arrow -->\n        <line data-howline=\"\" x1=\"190\" y1=\"120\" x2=\"350\" y2=\"120\" stroke=\"var(--line)\" stroke-width=\"1.4\" stroke-dasharray=\"1\" pathLength=\"1\" style=\"stroke-dashoffset:1;\"><\u002Fline>\n        <path d=\"M345 114l8 6-8 6\" stroke=\"var(--line)\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-howarrow=\"\" style=\"opacity:0;\"><\u002Fpath>\n        <!-- connected side -->\n        <line data-howline=\"\" x1=\"430\" y1=\"70\" x2=\"500\" y2=\"60\" stroke=\"var(--line)\" stroke-width=\"1.4\" stroke-dasharray=\"1\" pathLength=\"1\" style=\"stroke-dashoffset:1;\"><\u002Fline>\n        <line data-howline=\"\" x1=\"500\" y1=\"60\" x2=\"540\" y2=\"118\" stroke=\"var(--line)\" stroke-width=\"1.4\" stroke-dasharray=\"1\" pathLength=\"1\" style=\"stroke-dashoffset:1;\"><\u002Fline>\n        <line data-howline=\"\" x1=\"540\" y1=\"118\" x2=\"468\" y2=\"150\" stroke=\"var(--line)\" stroke-width=\"1.4\" stroke-dasharray=\"1\" pathLength=\"1\" style=\"stroke-dashoffset:1;\"><\u002Fline>\n        <line data-howline=\"\" x1=\"468\" y1=\"150\" x2=\"430\" y2=\"70\" stroke=\"var(--line)\" stroke-width=\"1.4\" stroke-dasharray=\"1\" pathLength=\"1\" style=\"stroke-dashoffset:1;\"><\u002Fline>\n        <line data-howline=\"\" x1=\"468\" y1=\"150\" x2=\"500\" y2=\"60\" stroke=\"var(--line)\" stroke-width=\"1.4\" stroke-dasharray=\"1\" pathLength=\"1\" style=\"stroke-dashoffset:1;\"><\u002Fline>\n        <line data-howline=\"\" x1=\"430\" y1=\"70\" x2=\"540\" y2=\"118\" stroke=\"var(--line)\" stroke-width=\"1.4\" stroke-dasharray=\"1\" pathLength=\"1\" style=\"stroke-dashoffset:1;\"><\u002Fline>\n        <circle cx=\"430\" cy=\"70\" r=\"4\" fill=\"var(--star)\"><\u002Fcircle>\n        <circle cx=\"500\" cy=\"60\" r=\"3.4\" fill=\"var(--star)\"><\u002Fcircle>\n        <circle cx=\"540\" cy=\"118\" r=\"4.2\" fill=\"var(--star)\"><\u002Fcircle>\n        <circle cx=\"468\" cy=\"150\" r=\"3.6\" fill=\"var(--star)\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:28px; border-top:1px solid var(--border); padding-top:36px;\">\n        <div>\n          <div style=\"font-size:13px; font-weight:600; color:var(--accent); margin-bottom:10px; letter-spacing:0.04em;\">STEP 01<\u002Fdiv>\n          <h3 style=\"font-size:18px; font-weight:700; margin:0 0 7px; letter-spacing:-0.01em;\">We map how you work<\u002Fh3>\n          <p style=\"font-size:14px; line-height:1.55; color:var(--ink-soft); margin:0;\">We sit with how your business actually runs today — every task, every tool, every gap.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:13px; font-weight:600; color:var(--accent); margin-bottom:10px; letter-spacing:0.04em;\">STEP 02<\u002Fdiv>\n          <h3 style=\"font-size:18px; font-weight:700; margin:0 0 7px; letter-spacing:-0.01em;\">We connect the dots<\u002Fh3>\n          <p style=\"font-size:14px; line-height:1.55; color:var(--ink-soft); margin:0;\">We link the tools you already use and automate the manual steps in between them.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:13px; font-weight:600; color:var(--accent); margin-bottom:10px; letter-spacing:0.04em;\">STEP 03<\u002Fdiv>\n          <h3 style=\"font-size:18px; font-weight:700; margin:0 0 7px; letter-spacing:-0.01em;\">It runs itself<\u002Fh3>\n          <p style=\"font-size:14px; line-height:1.55; color:var(--ink-soft); margin:0;\">The flow runs in the background. You watch the dashboard instead of holding it all in your head.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== Who it's for / honesty ===== -->\n  <section id=\"fits\" data-screen-label=\"Who it's for\" style=\"position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:120px 32px; background:radial-gradient(700px 340px at 5% r(--ink); font-weight:600;\">no systems yet<\u002Fspan> — everything is manual and in your head.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex; gap:13px; align-items:flex-start;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0; margin-top:1px;\"><path d=\"M4 9.5l3.2 3.2L14 5.5\"><\u002Fpath><\u002Fsvg><p style=\"margin:0; font-size:15px; line-height:1.5; color:var(--ink-soft);\">You're an owner <span style=\"color:var(--ink); font-weight:600;\">drowning in manual admin<\u002Fspan> instead of doing the work you're good at.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex; gap:13px; align-items:flex-start;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0; margin-top:1px;\"><path d=\"M4 9.5l3.2 3.2L14 5.5\"><\u002Fpath><\u002Fsvg><p style=\"margin:0; font-size:15px; line-height:1.5; color:var(--ink-soft);\">You're <span style=\"color:var(--ink); font-weight:600;\">losing leads<\u002Fspan> to missed calls and slow replies.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:transparent; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid var(--border); border-radius:20px; padding:38px 34px;\">\n        <h3 style=\"font-size:21px; font-weight:700; letter-spacing:-0.01em; margin:0 0 24px; color:var(--ink-soft); display:flex; align-items:center; gap:10px;\"><span style=\"width:8px; height:8px; border-radius:50%; background:var(--ink-faint);\"><\u002Fspan>Probably not yet if…<\u002Fh3>\n        <div style=\"display:flex; flex-direction:column; gap:18px;\">\n          <div style=\"display:flex; gap:13px; align-items:flex-start;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"var(--ink-faint)\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink:0; margin-top:1px;\"><path d=\"M5 5l8 8 M13 5l-8 8\"><\u002Fpath><\u002Fsvg><p style=\"margin:0; font-size:15px; line-height:1.5; color:var(--ink-soft);\">You're <span style=\"color:var(--ink); font-weight:600;\">already fully automated<\u002Fspan> — you don't need us to start from scratch.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex; gap:13px; align-items:flex-start;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"var(--ink-faint)\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink:0; margin-top:1px;\"><path d=\"M5 5l8 8 M13 5l-8 8\"><\u002Fpath><\u002Fsvg><p style=\"margin:0; font-size:15px; line-height:1.5; color:var(--ink-soft);\">You want a <span style=\"color:var(--ink); font-weight:600;\">cheap, self-serve app<\u002Fspan> to configure yourself.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex; gap:13px; align-items:flex-start;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"var(--ink-faint)\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink:0; margin-top:1px;\"><path d=\"M5 5l8 8 M13 5l-8 8\"><\u002Fpath><\u002Fsvg><p style=\"margin:0; font-size:15px; line-height:1.5; color:var(--ink-soft);\">You'd rather <span style=\"color:var(--ink); font-weight:600;\">build it in-house<\u002Fspan>. Zephlyn is done-for-you, start to finish.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== FAQ ===== -->\n  <section id=\"faq\" data-screen-label=\"FAQ\" style=\"position:relative; z-index:2; max-width:820px; margin:0 auto; padding:120px 32px; background:radial-gradient(640px 280px at 50% 160px, color-mix(in srgb, var(--bg) 90%, transparent) 0%, transparent 72%) no-repeat;\">\n    <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:22px; justify-content:center;\">\n      <span style=\"width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px 1px var(--accent);\"><\u002Fspan>\n      <span style=\"text-transform:uppercase; letter-spacing:0.2em; font-size:12px; font-weight:600; color:var(--accent);\">Questions<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"text-align:center; font-size:clamp(32px,4.4vw,52px); line-height:1.06; letter-spacing:-0.025em; font-weight:800; margin:0 auto 56px; max-width:560px;\">The things you're wondering.<\u002Fh2>\n    <div style=\"background:var(--card); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--panel-line); border-radius:18px; padding:4px 28px;\">\n      <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div style=\"border-bottom:1px solid var(--border);\">\n          <button onclick=\"{{ item.onClick }}\" style=\"width:100%; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:24px 4px; background:none; border:none; cursor:pointer; text-align:left; color:var(--ink); font-family:inherit;\">\n            <span style=\"font-size:clamp(16px,2vw,19px); font-weight:600; letter-spacing:-0.01em;\">{{ item.q }}<\u002Fspan>\n            <span style=\"flex-shrink:0; width:22px; height:22px; position:relative; transition:transform 0.3s ease; transform:{{ item.rot }};\">\n              <span style=\"position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:13px; height:1.6px; background:var(--accent);\"><\u002Fspan>\n              <span style=\"position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(90deg); width:13px; height:1.6px; background:var(--accent);\"><\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0; padding:0 4px 26px; font-size:16px; line-height:1.65; color:var(--ink-soft); max-width:680px;\">{{ item.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== Final CTA ===== -->\n  <section id=\"cta\" data-screen-label=\"Final CTA\" style=\"position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:80px 32px 130px;\">\n    <div ref=\"{{ ctaRef }}\" style=\"position:relative; background:var(--card); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--panel-line); border-radius:28px; padding:clamp(56px,9vw,104px) 32px; text-align:center; overflow:hidden;\">\n      <svg viewBox=\"0 0 300 80\" width=\"200\" height=\"54\" style=\"display:block; margin:0 auto 30px; overflow:visible;\" fill=\"none\">\n        <line data-ctaline=\"\" x1=\"40\" y1=\"58\" x2=\"100\" y2=\"22\" stroke=\"var(--line)\" stroke-width=\"1.5\" pathLength=\"1\" stroke-dasharray=\"1\" style=\"stroke-dashoffset:1;\"><\u002Fline>\n        <line data-ctaline=\"\" x1=\"100\" y1=\"22\" x2=\"150\" y2=\"46\" stroke=\"var(--line)\" stroke-width=\"1.5\" pathLength=\"1\" style=\"stroke-dasharray:1; stroke-dashoffset:1;\"><\u002Fline>\n        <line data-ctaline=\"\" x1=\"150\" y1=\"46\" x2=\"200\" y2=\"20\" stroke=\"var(--line)\" stroke-width=\"1.5\" pathLength=\"1\" style=\"stroke-dasharray:1; stroke-dashoffset:1;\"><\u002Fline>\n        <line data-ctaline=\"\" x1=\"200\" y1=\"20\" x2=\"260\" y2=\"56\" stroke=\"var(--line)\" stroke-width=\"1.5\" pathLength=\"1\" style=\"stroke-dasharray:1; stroke-dashoffset:1;\"><\u002Fline>\n        <circle cx=\"40\" cy=\"58\" r=\"4\" fill=\"var(--star)\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"22\" r=\"5\" fill=\"var(--accent)\"><\u002Fcircle>\n        <circle cx=\"150\" cy=\"46\" r=\"3.6\" fill=\"var(--star)\"><\u002Fcircle>\n        <circle cx=\"200\" cy=\"20\" r=\"5\" fill=\"var(--accent)\"><\u002Fcircle>\n        <circle cx=\"260\" cy=\"56\" r=\"4\" fill=\"var(--star)\"><\u002Fcircle>\n      <\u002Fsvg>\n      <h2 style=\"font-size:clamp(34px,5vw,60px); line-height:1.04; letter-spacing:-0.03em; font-weight:800; margin:0 auto 20px; max-width:640px;\">Let's connect the dots.<\u002Fh2>\n      <p style=\"font-size:clamp(17px,2vw,20px); line-height:1.55; color:var(--ink-soft); max-width:520px; margin:0 auto 38px;\">You bring the scattered pieces. We'll turn them into one system that runs itself.<\u002Fp>\n      <div style=\"display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;\">\n        <a data-mail=\"\" style=\"display:inline-flex; align-items:center; gap:9px; font-size:15px; font-weight:600; color:#fff; background:var(--accent); padding:15px 30px; border-radius:999px; text-decoration:none; box-shadow:0 12px 34px -12px var(--accent); transition:transform 0.2s ease, box-shadow 0.2s ease;\" style-hover=\"transform:translateY(-2px); box-shadow:0 18px 40px -12px var(--accent);\">Get in touch<\u002Fa>\n        <a data-mail=\"\" data-mail-text=\"\" style=\"font-size:15px; font-weight:600; color:var(--ink-soft); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:var(--ink);\"><\u002Fa>\n      <\u002Fdiv>\n      <p style=\"font-size:13.5px; line-height:1.6; color:var(--ink-faint); max-width:440px; margin:40px auto 0;\">Two founders. Pre-revenue. Building this with our first customers — and we'd love for you to be one.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== Footer ===== -->\n  <footer style=\"position:relative; z-index:2; background:radial-gradient(900px 240px at 50% 40%, color-mix(in srgb, var(--bg) 88%, transparent) 0%, transparent 78%) no-repeat; border-top:1px solid var(--border); max-width:1180px; margin:0 auto; padding:48px 32px 64px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:24px;\">\n    <div style=\"display:flex; align-items:center; gap:10px;\">\n      <span style=\"width:20px; height:20px; border-radius:6px; background:var(--accent); display:inline-block; box-shadow:0 0 14px -3px var(--accent);\"><\u002Fspan>\n      <span style=\"font-size:16px; font-weight:700; letter-spacing:-0.02em;\">Zephlyn<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:26px; flex-wrap:wrap;\">\n      <a href=\"#problem\" style=\"font-size:14px; color:var(--ink-soft); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:var(--ink);\">The problem<\u002Fa>\n      <a href=\"#services\" style=\"font-size:14px; color:var(--ink-soft); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:var(--ink);\">Services<\u002Fa>\n      <a href=\"#how\" style=\"font-size:14px; color:var(--ink-soft); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:var(--ink);\">How it works<\u002Fa>\n      <a href=\"#faq\" style=\"font-size:14px; color:var(--ink-soft); text-decoration:none; transition:color 0.2s;\" style-hover=\"color:var(--ink);\">FAQ<\u002Fa>\n      <a data-mail=\"\" data-mail-text=\"\" style=\"font-size:14px; color:var(--ink); font-weight:600; text-decoration:none;\"><\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-size:13px; color:var(--ink-faint); width:100%;\">© 2026 Zephlyn. We give small businesses systems.<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8268f0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;starCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:62,&quot;min&quot;:18,&quot;max&quot;:110,&quot;tsType&quot;:&quot;number&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Your business, finally running itself.&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { openFaq: -1, theme: 'dark' };\n\n  constructor(props) {\n    super(props);\n    this.rootRef = (el) => { if (el) this.root = el; };\n    this.skyRef = (el) => { if (el) { this.sky = el; this._buildSky(); } };\n    this.fillRef = (el) => { if (el) this.fill = el; };\n    this.dotsRef = (el) => { if (el) this.dots = el; };\n    this.svcRef = (el) => { if (el) this.svc = el; };\n    this.howRef = (el) => { if (el) this.how = el; };\n    this.ctaRef = (el) => { if (el) this.cta = el; };\n    this.headlineRef = (el) => { if (el) this.headline = el; };\n\n    this.faqItems = [\n      { q: 'How long does setup take?', a: 'Most setups run two to four weeks. We map your workflow, connect your tools, and test everything before it goes live — and you keep working the whole time.' },\n      { q: 'Do I have to switch the tools I use?', a: 'No. We connect the tools you already use wherever we can, and only suggest a change when something is actively holding you back. The goal is to build on what you have, not replace it.' },\n      { q: \"What if I'm not technical?\", a: \"That's exactly the point. Zephlyn is done-for-you — you don't configure anything. We build the system, you use it. If you can run your business, you can use what we hand you.\" },\n      { q: 'What does it cost?', a: \"It depends on how much we're connecting. We scope it with you up front, in plain numbers, before any work starts. No surprise pricing, no long lock-in.\" },\n      { q: 'Is this a product or a service?', a: 'A service that leaves you with a system. We build and maintain the automation; you own the workflow it runs. Think of us as the team that finally sets up the systems you never had time to.' },\n      { q: 'What if something breaks?', a: \"We monitor what we build and fix issues fast. You're not handed a tool and left alone — we stay on it, because the whole promise is a system you can stop thinking about.\" },\n    ];\n\n    // Curated narrative constellation (viewBox 0..1000). rev<0 => visible from top.\n    this.starData = [\n      {x:140,y:160,r:2.4,op:0.95,rev:-0.2,glow:1},{x:300,y:120,r:1.5,op:0.6,rev:0.05,glow:0},\n      {x:470,y:210,r:2.0,op:0.9,rev:-0.2,glow:1},{x:250,y:300,r:1.4,op:0.55,rev:0.07,glow:0},\n      {x:120,y:420,r:1.8,op:0.8,rev:0.09,glow:0},{x:380,y:440,r:2.6,op:0.95,rev:-0.2,glow:1},\n      {x:560,y:360,r:1.5,op:0.6,rev:0.10,glow:0},{x:700,y:180,r:2.2,op:0.9,rev:-0.2,glow:1},\n      {x:840,y:260,r:1.5,op:0.6,rev:0.12,glow:0},{x:660,y:470,r:2.0,op:0.9,rev:-0.2,glow:1},\n      {x:820,y:460,r:1.4,op:0.55,rev:0.14,glow:0},{x:200,y:580,r:1.7,op:0.7,rev:0.12,glow:0},\n      {x:420,y:620,r:2.3,op:0.9,rev:-0.2,glow:1},{x:600,y:640,r:1.6,op:0.65,rev:0.16,glow:0},\n      {x:770,y:620,r:2.0,op:0.85,rev:0.10,glow:0},{x:300,y:760,r:1.5,op:0.6,rev:0.18,glow:0},\n      {x:500,y:800,r:2.4,op:0.95,rev:-0.2,glow:1},{x:690,y:800,r:1.6,op:0.65,rev:0.20,glow:0},\n      {x:880,y:720,r:1.7,op:0.7,rev:0.16,glow:0},{x:150,y:720,r:1.4,op:0.55,rev:0.18,glow:0},\n      {x:470,y:520,r:1.6,op:0.65,rev:0.12,glow:0},{x:920,y:520,r:1.5,op:0.55,rev:0.16,glow:0},\n    ];\n    this.edges = [\n      [0,1,0.14],[1,2,0.18],[2,6,0.26],[6,5,0.30],[5,3,0.22],[3,0,0.16],[3,4,0.20],\n      [4,11,0.34],[2,7,0.24],[7,8,0.30],[8,10,0.42],[6,9,0.32],[9,10,0.46],[9,20,0.38],\n      [20,5,0.36],[20,13,0.50],[13,12,0.48],[12,11,0.46],[11,19,0.56],[12,15,0.58],\n      [15,16,0.64],[16,13,0.60],[16,17,0.68],[17,14,0.66],[14,18,0.72],[18,21,0.78],\n      [14,21,0.74],[13,17,0.70],[20,6,0.42],[9,14,0.62],[16,19,0.84],[21,10,0.88],[0,4,0.92],\n    ];\n\n    this.reduced = false;\n    this.lineMul = 1;\n    this._tick = this._tick.bind(this);\n  }\n\n  componentDidMount() {\n    this.reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    // Initial theme: match system\n    const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;\n    this._applyTheme(prefersLight ? 'light' : 'dark');\n    // custom headline prop\n    const hl = this.props.headline;\n    if (hl && hl !== 'Your business, finally running itself.' && this.headline) {\n      this.headline.textContent = hl;\n    }\n    // Assemble email client-side so the serving proxy doesn't obfuscate the literal address\n    const addr = 'hello' + '@' + 'zephlyn' + '.co';\n    if (this.root) {\n      this.root.querySelectorAll('[data-mail]').forEach((a) => {\n        a.setAttribute('href', 'mailto:' + addr);\n        if (a.hasAttribute('data-mail-text')) a.textContent = addr;\n      });\n    }\n    window.addEventListener('scroll', this._onScroll = () => this._requestTick(), { passive: true });\n    window.addEventListener('resize', this._onScroll, { passive: true });\n    this._setupObservers();\n    this._requestTick();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('resize', this._onScroll);\n    if (this._io) this._io.disconnect();\n  }\n\n  _accent() { return this.props.accent || '#8268f0'; }\n\n  _applyTheme(name) {\n    const acc = this._accent();\n    const themes = {\n      dark: {\n        '--bg':'#0b0a0f','--bg-2':'#15131e','--panel':'rgba(255,255,255,0.028)','--panel-line':'rgba(255,255,255,0.08)',\n        '--ink':'#f4f1ea','--ink-soft':'rgba(244,241,234,0.66)','--ink-faint':'rgba(244,241,234,0.40)',\n        '--border':'rgba(244,241,234,0.12)','--accent':acc,'--line':acc,'--star':'#f3ecda',\n        '--card':'rgba(18,16,26,0.62)','--nav-bg':'rgba(11,10,15,0.62)','--sun-d':'inline-flex','--moon-d':'none',\n      },\n      light: {\n        '--bg':'#f5f2ea','--bg-2':'#ffffff','--panel':'rgba(27,33,56,0.022)','--panel-line':'rgba(27,33,56,0.10)',\n        '--ink':'#1b2138','--ink-soft':'rgba(27,33,56,0.64)','--ink-faint':'rgba(27,33,56,0.42)',\n        '--border':'rgba(27,33,56,0.13)','--accent':acc,'--line':acc,'--star':'#222a47',\n        '--card':'rgba(255,255,255,0.55)','--nav-bg':'rgba(245,242,234,0.62)','--sun-d':'none','--moon-d':'inline-flex',\n      },\n    };\n    const t = themes[name];\n    if (this.root && t) { for (const k in t) this.root.style.setProperty(k, t[k]); }\n    // Light mode: let the background constellation lines recede further than in dark\n    this.lineMul = name === 'light' ? 0.48 : 1;\n    if (this.lineEls) {\n      if (this.reduced) this.lineEls.forEach(({ el, maxOp }) => { el.style.opacity = (maxOp * this.lineMul).toFixed(3); });\n      else this._requestTick();\n    }\n    this.setState({ theme: name });\n  }\n\n  toggleTheme = () => { this._applyTheme(this.state.theme === 'dark' ? 'light' : 'dark'); };\n\n  _buildSky() {\n    if (!this.sky || this._built) return;\n    this._built = true;\n    const NS = 'http://www.w3.org/2000/svg';\n    const svg = document.createElementNS(NS, 'svg');\n    svg.setAttribute('viewBox', '0 0 1000 1000');\n    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');\n    svg.setAttribute('width', '100%');\n    svg.setAttribute('height', '100%');\n    svg.style.display = 'block';\n    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n    // Three ambient depth layers: far (tiny/faint/slow) -> near (large/bright/fast)\n    const count = Math.max(18, Math.min(110, this.props.starCount || 62));\n    const depthLayers = [\n      { frac: 0.46, rMin: 0.3, rMax: 0.8, opMin: 0.05, opMax: 0.16, par: 8,  anim: 'zdrift1', dur: 150, tw: 0.10, glow: false },\n      { frac: 0.34, rMin: 0.6, rMax: 1.2, opMin: 0.15, opMax: 0.32, par: -24, anim: 'zdrift2', dur: 116, tw: 0.28, glow: false },\n      { frac: 0.20, rMin: 1.1, rMax: 2.3, opMin: 0.44, opMax: 0.88, par: 52, anim: 'zdrift1', dur: 90,  tw: 0.60, glow: true },\n    ];\n    this.ambient = [];\n    depthLayers.forEach((L) => {\n      const g = document.createElementNS(NS, 'g');\n      if (!reduced) g.style.animation = `${L.anim} ${L.dur}s ease-in-out infinite alternate`;\n      const n = Math.round(count * L.frac);\n      for (let i = 0; i < n; i++) {\n        const cx = Math.random() * 1000, cy = Math.random() * 1000;\n        const r = L.rMin + Math.random() * (L.rMax - L.rMin);\n        if (L.glow && Math.random() > 0.45) {\n          const halo = document.createElementNS(NS, 'circle');\n          halo.setAttribute('cx', cx.toFixed(1)); halo.setAttribute('cy', cy.toFixed(1));\n          halo.setAttribute('r', (r * 3.6).toFixed(2));\n          halo.style.fill = 'var(--star)'; halo.style.opacity = '0.07';\n          g.appendChild(halo);\n        }\n        const c = document.createElementNS(NS, 'circle');\n        c.setAttribute('cx', cx.toFixed(1)); c.setAttribute('cy', cy.toFixed(1));\n        c.setAttribute('r', r.toFixed(2));\n        c.style.fill = 'var(--star)';\n        c.style.opacity = (L.opMin + Math.random() * (L.opMax - L.opMin)).toFixed(2);\n        if (!reduced && Math.random() < L.tw) {\n          c.style.animation = `ztwinkle ${(3 + Math.random() * 5).toFixed(1)}s ease-in-out infinite`;\n          c.style.animationDelay = `${(Math.random() * 5).toFixed(1)}s`;\n        }\n        g.appendChild(c);\n      }\n      this.ambient.push({ g, par: L.par });\n      svg.appendChild(g);\n    });\n\n    // Narrative constellation (the subject layer): lines, then stars\n    const ng = document.createElementNS(NS, 'g');\n    this.narrativeG = ng;\n    this.lineEls = [];\n    this.haloEls = [];\n    this.edges.forEach((e) => {\n      const a = this.starData[e[0]], b = this.starData[e[1]];\n      const prominent = !!(a.glow || b.glow);\n      const ln = document.createElementNS(NS, 'line');\n      ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y);\n      ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);\n      ln.setAttribute('pathLength', '1');\n      ln.style.stroke = 'var(--line)';\n      ln.style.strokeWidth = prominent ? '1.15' : '0.6';\n      ln.style.strokeLinecap = 'round';\n      ln.style.strokeDasharray = '1';\n      const maxOp = prominent ? 0.62 : 0.26;\n      ln.style.strokeDashoffset = reduced ? '0' : '1';\n      ln.style.opacity = reduced ? String(maxOp) : '0';\n      this.lineEls.push({ el: ln, th: e[2], maxOp });\n      ng.appendChild(ln);\n    });\n    this.starEls = [];\n    this.starData.forEach((s) => {\n      const r = s.glow ? s.r * 1.28 : s.r * 0.82;\n      if (s.glow) {\n        const halo = document.createElementNS(NS, 'circle');\n        halo.setAttribute('cx', s.x); halo.setAttribute('cy', s.y);\n        halo.setAttribute('r', (r * 4.6).toFixed(2));\n        halo.style.fill = 'var(--accent)';\n        halo.style.opacity = reduced ? '0.14' : '0';\n        this.haloEls.push({ el: halo, rev: s.rev });\n        ng.appendChild(halo);\n      }\n      const c = document.createElementNS(NS, 'circle');\n      c.setAttribute('cx', s.x); c.setAttribute('cy', s.y); c.setAttribute('r', r.toFixed(2));\n      c.style.fill = 'var(--star)';\n      c.style.opacity = reduced ? String(s.op) : '0';\n      this.starEls.push({ el: c, data: s });\n      ng.appendChild(c);\n    });\n    svg.appendChild(ng);\n    this.sky.appendChild(svg);\n  }\n\n  _setupObservers() {\n    const cb = (entries) => {\n      entries.forEach((en) => {\n        if (!en.isIntersecting) return;\n        const root = en.target;\n        const lines = root.querySelectorAll('[data-svcline],[data-howline],[data-ctaline]');\n        lines.forEach((ln, i) => {\n          if (!this.reduced) {\n            ln.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)';\n            ln.style.transitionDelay = (i * 0.13) + 's';\n          }\n          ln.style.strokeDashoffset = '0';\n        });\n        const arrow = root.querySelector('[data-howarrow]');\n        if (arrow) {\n          if (!this.reduced) { arrow.style.transition = 'opacity 0.6s ease'; arrow.style.transitionDelay = '0.5s'; }\n          arrow.style.opacity = '1';\n        }\n        this._io.unobserve(root);\n      });\n    };\n    this._io = new IntersectionObserver(cb, { threshold: 0.4 });\n    [this.svc, this.how, this.cta].forEach((el) => { if (el) this._io.observe(el); });\n  }\n\n  _requestTick() { if (!this._raf) this._raf = requestAnimationFrame(this._tick); }\n\n  _tick() {\n    this._raf = null;\n    const doc = document.documentElement;\n    const max = doc.scrollHeight - window.innerHeight;\n    const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;\n\n    if (this.fill) this.fill.style.height = (p * 100) + '%';\n    if (this.dots) {\n      const anchors = this.dots.querySelectorAll('a[data-frac]');\n      anchors.forEach((a) => {\n        const f = parseFloat(a.getAttribute('data-frac'));\n        const on = p >= f - 0.01;\n        a.style.background = on ? 'var(--line)' : 'var(--bg)';\n        a.style.borderColor = on ? 'var(--line)' : 'var(--border)';\n        a.style.transform = on ? 'scale(1.25)' : 'scale(1)';\n        a.style.boxShadow = on ? '0 0 10px 0 var(--line)' : 'none';\n      });\n    }\n\n    if (this.reduced) return;\n    const clamp = (v) => Math.min(1, Math.max(0, v));\n    if (this.starEls) this.starEls.forEach(({ el, data }) => {\n      el.style.opacity = (data.op * clamp((p - data.rev) / 0.05)).toFixed(3);\n    });\n    if (this.haloEls) this.haloEls.forEach(({ el, rev }) => {\n      el.style.opacity = (0.14 * clamp((p - rev) / 0.05)).toFixed(3);\n    });\n    if (this.lineEls) this.lineEls.forEach(({ el, th, maxOp }) => {\n      const t = clamp((p - th) / 0.05);\n      el.style.strokeDashoffset = (1 - t).toFixed(3);\n      el.style.opacity = (maxOp * t * (this.lineMul || 1)).toFixed(3);\n    });\n    if (this.narrativeG) this.narrativeG.style.transform = `translateY(${(-p * 30).toFixed(1)}px)`;\n    if (this.ambient) this.ambient.forEach(({ g, par }) => {\n      g.style.transform = `translateY(${(p * par).toFixed(1)}px)`;\n    });\n  }\n\n  renderVals() {\n    return {\n      rootRef: this.rootRef, skyRef: this.skyRef, fillRef: this.fillRef, dotsRef: this.dotsRef,\n      svcRef: this.svcRef, howRef: this.howRef, ctaRef: this.ctaRef, headlineRef: this.headlineRef,\n      toggleTheme: this.toggleTheme,\n      faqs: this.faqItems.map((f, i) => ({\n        q: f.q, a: f.a,\n        open: this.state.openFaq === i,\n        rot: this.state.openFaq === i ? 'rotate(135deg)' : 'rotate(0deg)',\n        onClick: () => this.setState((s) => ({ openFaq: s.openFaq === i ? -1 : i })),\n      })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"Zephlyn.dc"}
